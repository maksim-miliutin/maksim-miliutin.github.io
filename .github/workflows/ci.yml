name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci rather than install: it puts in exactly what package-lock.json holds,
      # and fails when that file has drifted from package.json.
      - run: npm ci

      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
